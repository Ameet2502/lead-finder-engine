name: Daily Lead Engine
# 7:47 AM IST = people + emails + jobs (full run).  5:53 PM IST = jobs only.
on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '23 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = people + jobs, light = jobs only, auto = by time of day'
        default: full
        type: choice
        options: [full, light, auto]
concurrency: { group: daily-engine, cancel-in-progress: false }
permissions: { contents: read, actions: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Load memory from last run
        uses: actions/cache/restore@v4
        with: { path: state, key: 'daily-state-${{ github.run_id }}', restore-keys: 'daily-state-' }
      - name: Run Daily Lead Engine
        env:
          KEYS_TXT: ${{ secrets.KEYS_TXT }}
          # each key can also be its own secret (it wins over KEYS_TXT)
          SHEET_SCRIPT_URL: ${{ secrets.SHEET_SCRIPT_URL }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
          TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          REOON_KEY: ${{ secrets.REOON_KEY }}
          LINKUP_KEY: ${{ secrets.LINKUP_KEY }}
          EXA_KEY: ${{ secrets.EXA_KEY }}
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
          SERPER_KEY: ${{ secrets.SERPER_KEY }}
          HUNTER_KEY: ${{ secrets.HUNTER_KEY }}
          QEV_KEY: ${{ secrets.QEV_KEY }}
          # daily ceilings (each free allowance is also spread evenly over the month by the engine)
          TAVILY_DAILY_CAP: '500'
          EXA_DAILY_CAP: '500'
          FIRECRAWL_DAILY_CAP: '500'
          LINKUP_DAILY_CAP: '1000'
          SERPER_DAILY_CAP: '1000'
          REOON_DAILY_CAP: '2000'
          VERIFIED_PER_SECTION: '50'
          SHADY_PER_SECTION: '50'
          # search order: monthly free ones first (Tavily, Exa, Firecrawl), then one-time credits (Linkup, Serper) with no daily ceiling
          SET_max_queries_per_track: '150'
          SET_max_searches_per_node: '150'
          TOTAL_VERIFIED_TARGET: '100'
          RUN_MODE: ${{ inputs.mode == 'auto' && '' || inputs.mode }}
        run: node run.js Daily_Lead_Engine.json --state state/daily.json
      - name: Save memory for next run
        if: always()
        uses: actions/cache/save@v4
        with: { path: state, key: 'daily-state-${{ github.run_id }}' }
